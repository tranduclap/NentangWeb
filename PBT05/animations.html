<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions & Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="spinner-container">
        <div class="loading-spinner"></div>
        <p>Đang tải dữ liệu...</p>
    </div>

    <div class="demo-container">
        
        <h2>Danh sách sản phẩm mẫu (Hiệu ứng Animations)</h2>
        
        <div class="product-grid">
            
            <div class="product-card fade-in-element">
                <div class="img-container">
                    <img src="https://picsum.photos/400/300?random=11" alt="Sản phẩm công nghệ">
                </div>
                <div class="card-body">
                    <h4>Tai nghe Gaming Pro X</h4>
                    <p class="price">3.500.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

            <div class="product-card fade-in-element">
                <div class="img-container">
                    <img src="https://picsum.photos/400/300?random=12" alt="Sản phẩm công nghệ">
                </div>
                <div class="card-body">
                    <h4>Bàn phím cơ Không Dây</h4>
                    <p class="price">2.250.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

            <div class="product-card fade-in-element">
                <div class="img-container">
                    <img src="https://picsum.photos/400/300?random=13" alt="Sản phẩm công nghệ">
                </div>
                <div class="card-body">
                    <h4>Chuột Ergonomic Bluetooth</h4>
                    <p class="price">1.690.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

            <div class="product-card fade-in-element">
                <div class="img-container">
                    <img src="https://picsum.photos/400/300?random=14" alt="Sản phẩm công nghệ">
                </div>
                <div class="card-body">
                    <h4>Đèn LED Màn Hình Đọc Sách</h4>
                    <p class="price">950.000đ</p>
                    <button class="btn-buy">Mua ngay</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
