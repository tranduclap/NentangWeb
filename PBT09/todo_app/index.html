<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Quản lý Việc cần làm (Todo App)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="todo-container">
        <header class="todo-header">
            <h1>todos</h1>
        </header>

        <div class="todo-input-wrapper">
            <input type="text" id="todoInput" placeholder="Bạn cần làm việc gì tiếp theo?" autofocus autocomplete="off">
            <button id="addBtn">Thêm</button>
        </div>

        <ul id="todoList">
            </ul>

        <footer class="todo-footer" id="todoFooter">
            <span class="todo-count" id="todoCount">0 items left</span>
            
            <div class="todo-filters" id="todoFilters">
                <button data-filter="all" class="filter-btn active">All</button>
                <button data-filter="active" class="filter-btn">Active</button>
                <button data-filter="completed" class="filter-btn">Completed</button>
            </div>
            
            <button id="clearCompletedBtn" class="clear-completed">Clear completed</button>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
