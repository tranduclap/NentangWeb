<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-API Dashboard</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Multi-API Dashboard</h1>
            <p>Gọi song song 3 API khác nhau rồi hiển thị kết quả từng widget.</p>
            <button id="refreshBtn">Refresh All</button>
            <div id="timeInfo" class="time-info"></div>
        </header>

        <div id="widgets" class="widgets">
            <div class="widget" data-key="users">
                <h2>Random Users</h2>
                <div class="widget-body" id="usersBody">Loading...</div>
            </div>
            <div class="widget" data-key="countries">
                <h2>Country Info</h2>
                <div class="widget-body" id="countriesBody">Loading...</div>
            </div>
            <div class="widget" data-key="dogs">
                <h2>Dog Images</h2>
                <div class="widget-body" id="dogsBody">Loading...</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
